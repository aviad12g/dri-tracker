name: Daily reading

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-reading
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test
        working-directory: backend
        run: |
          pip install pytest
          python -m pytest -q
      - name: Collect observations
        working-directory: backend
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
          DRI_USER_AGENT: ${{ vars.DRI_USER_AGENT }}
        run: python -m dri collect
      - name: Re-read offline incident records (first of the month)
        working-directory: backend
        env:
          DRI_USER_AGENT: ${{ vars.DRI_USER_AGENT }}
        run: |
          if [ "$(date -u +%d)" = "01" ]; then python -m dri collect --sources adl_heat; fi
      - name: Build dataset
        working-directory: backend
        run: python -m dri build
      - name: Commit observations
        run: |
          git config user.name "dri-bot"
          git config user.email "dri-bot@users.noreply.github.com"
          git add data frontend/public/data
          git diff --staged --quiet || git commit -m "Reading for $(date -u +%F)"
          git push
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The site itself is deployed by Vercel, which rebuilds on every push to main.
      # Building it here only proves that the committed dataset still compiles into a site.
      - name: Check that the site builds
        working-directory: frontend
        run: |
          npm ci
          npm run build
