name: Rumble reachability test

# One-off check: can the Rumble collector read channel pages from GitHub's network?
# Writes nothing to the repository. Delete this file once the question is answered.
on:
  push:
    branches: [rebuild-v2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rumble:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run the Rumble collector
        working-directory: backend
        env:
          DRI_DATA: ${{ runner.temp }}/dri
        run: |
          python -m dri collect --sources rumble
          echo "--- observations recorded"
          cat "$DRI_DATA"/observations/rumble/*.jsonl 2>/dev/null || echo "(none)"
      - name: Show what one channel page returns
        working-directory: backend
        run: |
          python - <<'PY'
          import re
          from dri.http import Http
          resp = Http().get("https://rumble.com/c/TuckerCarlson", retries=0)
          print("status", resp.status, "bytes", len(resp.text))
          title = re.search(r"<title[^>]*>(.*?)</title>", resp.text, re.S)
          print("title", title.group(1).strip()[:80] if title else None)
          for m in list(re.finditer(r"[^<>]{0,60}[Ff]ollowers?[^<>]{0,20}", resp.text))[:8]:
              print("match", repr(m.group(0).strip()[:90]))
          for m in list(re.finditer(r'class="([^"]*follow[^"]*)"', resp.text))[:8]:
              print("class", m.group(1)[:80])
          PY
